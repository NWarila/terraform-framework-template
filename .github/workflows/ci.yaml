name: CI

# Self-validation for terraform-framework-template. Exercises the entire
# framework end-to-end on every PR with the same toolchain a real
# consumer would use.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  workflow-helper-tests:
    name: workflow helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Bats and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats shellcheck
      - name: ShellCheck workflow helpers
        run: shellcheck tools/install_ci_tools.sh tools/ci/*.sh
      - name: Check workflow run-block input binding
        run: python tools/ci/check_workflow_run_inputs.py .github/workflows
      - name: Bats workflow helper tests
        run: bats tests/ci/*.bats

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"

  terraform-ci:
    name: terraform verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Terraform
        # renovate: datasource=github-releases depName=hashicorp/terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - name: Install pinned CI tools
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          TFLINT_VERSION: "0.62.0"
          # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
          TERRAFORM_DOCS_VERSION: "0.23.0"
          # renovate: datasource=github-releases depName=open-policy-agent/opa
          OPA_VERSION: "1.10.0"
        run: bash tools/install_ci_tools.sh

      - name: Install Bats and ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Verify
        run: python tools/verify.py verify

      - name: Upload terraform test junit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-test-junit
          path: artifacts/terraform-test.xml
          if-no-files-found: warn
          retention-days: 14
